<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に合わせる。viewport-fit=cover でiPhoneの端まで使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ホーム画面に追加したとき、アプリのように全画面で起動するための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="筋トレノート">

  <!-- ダークモードに対応していることをブラウザに伝える -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <title>筋トレノート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== ホーム画面（今週の目標と実績） ===== -->
  <section id="screen-home" class="screen" hidden>
    <header class="screen-header"><h1>ホーム</h1></header>

    <div class="card home-week">
      <p id="home-range" class="home-range"></p>
      <!-- 「今週 2/3回」 -->
      <p class="home-count">
        今週 <strong id="home-done">0</strong><span class="home-slash">/</span><span id="home-target">-</span>回
      </p>
      <p id="home-message" class="home-message"></p>
      <!-- 日〜土の7つの丸（予定日は枠線、実施日は塗りつぶし） -->
      <div id="home-days" class="home-days"></div>
      <p class="home-legend">
        <span><i class="legend-mark is-plan"></i>予定</span>
        <span><i class="legend-mark is-done"></i>実施</span>
      </p>
    </div>

    <button type="button" id="btn-edit-plan" class="btn btn-sub btn-block">今週の予定を変更</button>
  </section>

  <!-- ===== カレンダー画面（上：月のカレンダー／下：履歴の一覧） ===== -->
  <section id="screen-calendar" class="screen" hidden>
    <header class="screen-header"><h1>カレンダー</h1></header>

    <!-- 月のカレンダー -->
    <div class="card calendar">
      <div class="cal-head">
        <button type="button" id="cal-prev" class="cal-nav" aria-label="前の月">‹</button>
        <h2 id="cal-title" class="cal-title"></h2>
        <button type="button" id="cal-next" class="cal-nav" aria-label="次の月">›</button>
      </div>
      <!-- 曜日（日曜はじまり） -->
      <div class="cal-week">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <!-- 日付のマスがここに入る -->
      <div id="cal-grid" class="cal-grid"></div>
    </div>

    <!-- 日付ごとの記録がここに入る -->
    <h2 class="list-title">履歴</h2>
    <div id="history-list"></div>
    <p id="history-empty" class="list-empty">まだ記録はありません</p>
  </section>

  <!-- ===== 入力画面 ===== -->
  <section id="screen-input" class="screen">
    <header class="screen-header"><h1>記録する</h1></header>

    <form id="record-form" class="card" novalidate>
      <!-- 日付 -->
      <label class="field">
        <span class="field-label">日付</span>
        <input type="date" id="input-date" required>
      </label>

      <!-- 部位 -->
      <label class="field">
        <span class="field-label">部位</span>
        <select id="input-part"></select>
      </label>

      <!-- 種目（部位によって選択肢が変わる） -->
      <label class="field">
        <span class="field-label">種目</span>
        <select id="input-exercise"></select>
      </label>

      <!-- 種目の追加（種目で「＋ 新しい種目を入力」を選んだときだけ表示） -->
      <div id="add-exercise" class="add-exercise" hidden>
        <input type="text" id="input-new-exercise" placeholder="新しい種目名" enterkeyhint="done">
        <button type="button" id="btn-add-exercise" class="btn btn-sub">追加</button>
        <button type="button" id="btn-cancel-exercise" class="btn btn-sub btn-plain">キャンセル</button>
      </div>

      <!-- 重量・回数・セット数（数字キーボードが出るように inputmode を指定） -->
      <div class="field-row">
        <label class="field">
          <span class="field-label">重量(kg)</span>
          <input type="text" id="input-weight" inputmode="decimal" placeholder="空=自重">
        </label>
        <label class="field">
          <span class="field-label">回数</span>
          <input type="text" id="input-reps" inputmode="numeric" pattern="[0-9]*">
        </label>
        <label class="field">
          <span class="field-label">セット</span>
          <input type="text" id="input-sets" inputmode="numeric" pattern="[0-9]*">
        </label>
      </div>

      <!-- メモ（任意） -->
      <label class="field">
        <span class="field-label">メモ（任意）</span>
        <input type="text" id="input-memo" placeholder="フォームの意識など">
      </label>

      <!-- エラーメッセージの表示場所 -->
      <p id="form-error" class="form-error" hidden></p>

      <!-- 登録ボタン（編集中は「更新する」に変わる） -->
      <button type="submit" id="btn-submit" class="btn btn-main">登録する</button>
      <button type="button" id="btn-cancel-edit" class="btn btn-sub btn-block" hidden>編集をやめる</button>
    </form>

    <!-- その日の記録一覧 -->
    <h2 id="list-title" class="list-title">この日の記録</h2>
    <ul id="record-list" class="record-list"></ul>
    <p id="list-empty" class="list-empty">まだ記録はありません</p>
  </section>

  <!-- ===== 画面下部のタブ ===== -->
  <!-- ===== 今週の予定を登録するメッセージ（画面の上に重ねて表示） ===== -->
  <div id="plan-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="plan-title">
    <div class="modal-box">
      <h2 id="plan-title" class="modal-title"></h2>
      <p class="modal-sub">ジムに行く曜日を選んでください</p>
      <!-- 日〜土のボタン（タップで選択／解除） -->
      <div id="plan-days" class="plan-days"></div>
      <p class="plan-count">今週の目標：<strong id="plan-count">0</strong>回</p>
      <button type="button" id="plan-ok" class="btn btn-main">OK</button>
      <div class="modal-actions">
        <button type="button" id="plan-later" class="btn btn-sub">あとで</button>
        <button type="button" id="plan-rest" class="btn btn-sub">今週は休み</button>
      </div>
    </div>
  </div>

  <nav class="tab-bar">
    <button type="button" class="tab" data-screen="home">
      <span class="tab-icon">🏠</span><span>ホーム</span>
    </button>
    <button type="button" class="tab" data-screen="calendar">
      <span class="tab-icon">📅</span><span>カレンダー</span>
    </button>
    <button type="button" class="tab is-active" data-screen="input">
      <span class="tab-icon">✏️</span><span>入力</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
